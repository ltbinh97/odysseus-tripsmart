# nginx reverse proxy for the TripSmart backend.
#   https://zah-40.123c.vn/*  ->  uvicorn on 127.0.0.1:3100
#
# TLS: reuses the server's EXISTING wildcard cert for *.123c.vn
# (/etc/nginx/certs/123c.vn.pem) — no certbot / Let's Encrypt needed.
# An exact server_name (zah-40.123c.vn) outranks the catch-all *.123c.vn block,
# so only this subdomain is routed to the backend; everything else is untouched.
#
# Install (RHEL, sudo):
#   sudo cp deploy/nginx-zah-40.conf /etc/nginx/conf.d/zah-40.conf
#   sudo setsebool -P httpd_can_network_connect 1     # SELinux: allow nginx->uvicorn
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP -> HTTPS redirect for this host.
server {
    listen 80;
    server_name zah-40.123c.vn;
    return 301 https://$host$request_uri;
}

# HTTPS: terminate TLS with the existing wildcard cert, proxy to uvicorn.
server {
    listen 443 ssl http2;
    server_name zah-40.123c.vn;

    ssl_certificate     /etc/nginx/certs/123c.vn.pem;
    ssl_certificate_key /etc/nginx/certs/123c.vn.key;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Server-Sent Events (POST /chat/stream) need streaming, not buffering ---
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
