# nginx reverse proxy for the TripSmart backend.
#   https://zah-40.123c.vn/*  ->  uvicorn on 127.0.0.1:3100
#
# Install (with sudo):
#   sudo cp deploy/nginx-zah-40.conf /etc/nginx/sites-available/zah-40
#   sudo ln -sf /etc/nginx/sites-available/zah-40 /etc/nginx/sites-enabled/zah-40
#   sudo nginx -t && sudo systemctl reload nginx
# Then add HTTPS:  sudo certbot --nginx -d zah-40.123c.vn
# (certbot rewrites this file to add the :443 TLS server block automatically.)

server {
    listen 80;
    server_name zah-40.123c.vn;

    # Allow larger chat payloads; keep it modest.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Server-Sent Events (POST /chat/stream) need streaming, not buffering ---
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
